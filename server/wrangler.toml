name = "dungeon-companion-sync"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Dopo `wrangler d1 create dungeon-companion` incolla qui il database_id stampato.
[[d1_databases]]
binding = "DB"
database_name = "dungeon-companion"
database_id = "06e7d8b1-84c4-4b37-8d61-27cafafb780c"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "dungeon-companion-blobs"

# Generazione immagini dei ritratti (piano gratuito giornaliero limitato)
[ai]
binding = "AI"

# L'app web (installabile come PWA) è servita dallo stesso Worker: prima `npm run build` nella cartella principale.
[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/c", "/c/*", "/health"]

[vars]
# Spazio massimo di file (PDF, mappe, ritratti) per campagna, in byte: 3 GB
# (lo spazio R2 gratuito è 10 GB in totale: se hai più campagne abbassalo)
MAX_CAMPAIGN_BYTES = "3221225472"
